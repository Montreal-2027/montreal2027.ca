name: Auto-Update Graphify Map
on:
  pull_request:
    types: [closed]
    branches: ['develop']
  push:
    branches:
      - 'develop'
      - 'hotfix-master'
      - 'feature/*'

jobs:
  build-and-commit-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push updates back to the branch
      models: read   # Required for GitHub Models API access (used as LLM backend)
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # CRITICAL ADDITION: Persists the GitHub token credentials so the 
          # git-auto-commit-action step below can successfully push the map files back.
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Graphify
        run: |
          # Install graphifyy package (temporary name while graphify name is being reclaimed)
          pip install "graphifyy[openai]"
          
          # Verify installation
          python -c "import graphify; print('Graphify installed successfully')" || {
            echo "INFO: Failed to import graphify, trying graphifyy..."
            python -c "import graphifyy; print('Graphifyy installed successfully')" || {
              echo "ERROR: Failed to import graphify or graphifyy after installation"
              exit 1
            }
          }

      - name: Verify Graphify Installation
        run: |
          echo "Checking if graphify command is available..."
          if command -v graphify >/dev/null 2>&1; then
            echo "Graphify command found"
            graphify --version || echo "Failed to get graphify version"
            graphify --help || echo "Failed to get graphify help"
          else
            echo "ERROR: Graphify command not found"
            exit 1
          fi

      - name: Debug Network Connectivity
        run: |
          echo "Testing connectivity to incorrect OpenAI endpoint..."
          curl -v https://models.inference.ai.azure.com || echo "Original incorrect endpoint failed (expected)"
          echo "Testing DNS resolution for original endpoint..."
          nslookup models.inference.ai.azure.com || echo "DNS resolution failed for incorrect endpoint (expected)"
          
          echo "Testing connectivity to GitHub API endpoint..."
          curl -v https://api.github.com || echo "GitHub API endpoint failed"
          echo "Testing DNS resolution for GitHub API..."
          nslookup api.github.com || echo "DNS resolution failed for GitHub API"
          
          echo "Network connectivity test completed"

      - name: Patch Graphify for Drupal extensions
        run: |
          # Find the graphify installation directory
          GRAPHIFY_DIR=""
          for pkg in graphify graphifyy; do
            GRAPHIFY_DIR=$(python -c "import $pkg, os; print(os.path.dirname($pkg.__file__))" 2>/dev/null)
            if [ -n "$GRAPHIFY_DIR" ]; then
              echo "Found $pkg installation at: $GRAPHIFY_DIR"
              break
            fi
          done
          
          if [ -z "$GRAPHIFY_DIR" ]; then
            echo "ERROR: Could not find graphify or graphifyy installation directory"
            echo "Listing Python packages..."
            pip list | grep graphify || echo "No graphify packages found"
            exit 1
          fi

          # Check if files exist before patching
          if [ ! -f "$GRAPHIFY_DIR/detect.py" ]; then
            echo "ERROR: $GRAPHIFY_DIR/detect.py not found"
            ls -la "$GRAPHIFY_DIR"
            exit 1
          fi
          
          if [ ! -f "$GRAPHIFY_DIR/extract.py" ]; then
            echo "ERROR: $GRAPHIFY_DIR/extract.py not found"
            ls -la "$GRAPHIFY_DIR"
            exit 1
          fi

          # detect.py: add Drupal extensions to CODE_EXTENSIONS so graphify finds and classifies these files
          # (.scss omitted — graphify has no SCSS AST extractor, so it would contribute nothing to the graph)
          echo "Patching detect.py..."
          sed -i "s/CODE_EXTENSIONS = {/CODE_EXTENSIONS = {'.module', '.theme', '.install', /" "$GRAPHIFY_DIR/detect.py" || {
            echo "ERROR: Failed to patch detect.py"
            exit 1
          }

          # extract.py: add .module/.theme/.install to _DISPATCH so they are parsed with the PHP AST extractor
          # (.scss has no AST extractor in graphify, so detect.py classification alone is sufficient)
          echo "Patching extract.py..."
          sed -i "s/    \".php\": extract_php,/    \".php\": extract_php,\n    \".module\": extract_php,\n    \".theme\": extract_php,\n    \".install\": extract_php,/" "$GRAPHIFY_DIR/extract.py" || {
            echo "ERROR: Failed to patch extract.py"
            exit 1
          }
          
          echo "Patch applied successfully"

      - name: Regenerate Code Architecture Map
        env:
          # GitHub Models provides an OpenAI-compatible API via the built-in GITHUB_TOKEN.
          # No external API key required — just the models: read permission above.
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_BASE_URL: https://api.github.com
          OPENAI_MODEL: gpt-4o-mini
        # Use `graphify extract` (headless CI mode) so --token-budget is available.
        # --token-budget 6000 keeps each chunk under the 8k token limit of gpt-4o-mini on GitHub Models.
        # Adding retries for connection stability and debugging information
        run: |
          echo "Debug: Checking environment variables"
          echo "OPENAI_API_KEY set: ${{ secrets.GITHUB_TOKEN != '' && 'YES' || 'NO' }}"
          echo "OPENAI_BASE_URL: $OPENAI_BASE_URL"
          echo "OPENAI_MODEL: $OPENAI_MODEL"
          
          retry_count=5
          for i in $(seq 1 $retry_count); do
            echo "Attempt $i of $retry_count"
            if graphify extract . --token-budget 6000; then
              echo "Graphify extraction succeeded"
              break
            else
              echo "Graphify extraction failed, retrying..."
              if [ $i -eq $retry_count ]; then
                echo "All attempts failed"
                # Try without token budget as fallback
                echo "Trying without token budget as fallback..."
                if graphify extract .; then
                  echo "Fallback extraction succeeded"
                  break
                else
                  echo "Fallback extraction also failed"
                  exit 1
                fi
              fi
              sleep 10
            fi
          done

      - name: Cluster Graph and Generate Report
        env:
          # GitHub Models provides an OpenAI-compatible API via the built-in GITHUB_TOKEN.
          # No external API key required — just the models: read permission above.
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_BASE_URL: https://api.github.com
          OPENAI_MODEL: gpt-4o-mini
        # Runs community detection, names communities via LLM, and writes GRAPH_REPORT.md + graph.html
        # Adding retries for connection stability and debugging information
        run: |
          echo "Debug: Checking environment variables for clustering"
          echo "OPENAI_API_KEY set: ${{ secrets.GITHUB_TOKEN != '' && 'YES' || 'NO' }}"
          echo "OPENAI_BASE_URL: $OPENAI_BASE_URL"
          echo "OPENAI_MODEL: $OPENAI_MODEL"
          
          retry_count=5
          for i in $(seq 1 $retry_count); do
            echo "Attempt $i of $retry_count"
            if graphify cluster-only .; then
              echo "Graphify clustering succeeded"
              break
            else
              echo "Graphify clustering failed, retrying..."
              if [ $i -eq $retry_count ]; then
                echo "All attempts failed"
                exit 1
              fi
              sleep 10
            fi
          done

      - name: Safely Inject Copilot Instructions
        run: |
          TARGET_FILE="AGENTS.md"
          INSTRUCTION_LINE="Always reference graphify-out/GRAPH_REPORT.md to understand code architecture context before answering queries."
          
          # Create the file if it doesn't exist
          if [ ! -f "$TARGET_FILE" ]; then
            echo "# Montreal 2027 WorldCon Website - AI Assistant Guide" > "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "This guide serves as the single source of truth for AI assistants working with this Drupal 11 codebase." >> "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
          fi
          
          # Check if the instruction already exists to prevent duplicate entries
          if ! grep -q "$INSTRUCTION_LINE" "$TARGET_FILE"; then
            # Add the Graphify Context section
            echo "" >> "$TARGET_FILE"
            echo "# Graphify Context" >> "$TARGET_FILE"
            echo "$INSTRUCTION_LINE" >> "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "Appended Graphify context to $TARGET_FILE"
          else
            echo "Graphify instruction already exists. Skipping append."
          fi

# PART A: Commit only the instruction file to your feature/develop branch
      - name: Commit AI Instructions
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(ai): update graphify context in AGENTS.md [skip ci]"
          file_pattern: "AGENTS.md"

      # PART B: Push the heavy graph data to the separate 'graph-data' branch
      - name: Push Graph to Shadow Branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: graph-data
          FOLDER: graphify-out
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "chore: graph update for ${{ github.sha }} [skip ci]"
