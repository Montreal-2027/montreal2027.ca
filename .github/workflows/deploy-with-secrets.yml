name: Deploy with Secrets Check
on:
  pull_request:
    types: [closed]
    branches: ['develop']
  push:
    branches:
      - 'feature/**'
      - 'hotfix-master'
  workflow_dispatch:

jobs:
  check-secrets:
    name: Checking for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Secret Scanner
        uses: dweinerATL/secret-scanner@b38e547e23c37b052023ce4940cec8888474ce85

  deploy:
    needs: check-secrets
    # if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            echo "Changing to deploy path"
            cd ${{ vars.DEPLOY_PATH }}
            echo "Setting proper permissions"
            chmod -R u+w web/sites/default
            echo "Getting updated repository info"
            git fetch origin
            echo "Checking out ${{github.ref_name}}"
            git checkout ${{github.ref_name}}
            echo "Pulling latest code"
            git pull

      - name: Backup Database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            export PATH="${{vars.PHP_PATH}}:$PATH"
            echo "Changing to deploy path"
            cd ${{ vars.DEPLOY_PATH }}
            echo "Backing up database"
            vendor/bin/drush sql:dump --gzip > "${{vars.BU_FILE_PATH}}${{ vars.BU_FILE_PREFIX }}.$(date +'%Y-%m-%d_%H:%M:%S').sql.gz"

      - name: Install Composer Dependencies
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            export PATH="${{vars.PHP_PATH}}:$PATH"
            echo "Changing to deploy path"
            cd ${{ vars.DEPLOY_PATH }}
            echo "Installing composer dependencies"
            ${{vars.COMPOSER}} install

      - name: Install NPM Dependencies
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            export PATH="${{vars.PHP_PATH}}:$PATH"
            echo "Changing to deploy path"
            cd ${{ vars.DEPLOY_PATH }}/web/themes/custom/montreal2027
            echo "Installing npm dependencies"
            npm install

      - name: Build Assets
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            export PATH="${{vars.PHP_PATH}}:$PATH"
            echo "Changing to deploy path"
            cd ${{ vars.DEPLOY_PATH }}/web/themes/custom/montreal2027
            echo "Building assets"
            npm run build:css

      - name: Clean up node_modules
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            echo "Changing to deploy path"
            cd ${{ vars.DEPLOY_PATH }}/web/themes/custom/montreal2027
            echo "Cleaning up node_modules"
            rm -rf node_modules
            git restore package-lock.json

      - name: Run Drush Commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            export PATH="${{vars.PHP_PATH}}:$PATH"
            echo "Changing to deploy path"
            cd ${{ vars.DEPLOY_PATH }}
            echo "Running Drush Deploy command"
            vendor/bin/drush deploy