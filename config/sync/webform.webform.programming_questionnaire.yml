elements: |-
  intro:
    '#type': processed_text
    '#admin_title': 'Form Intro'
    '#text': '<h1 class="text-align-center">Programming Participation Questionnaire</h1><p>Please note that this form is only preliminary, and a survey with more detailed questions will be sent at a later date. We expect many more people to apply to participate than we can accommodate in programming. We cannot guarantee participation for anyone in advance. In any case, though, we thank you for offering to help out.</p><p>Note that, to participate in Montréal 2027 Worldcon in-person programming, you will need to acquire a <a href="https://montreal2027.ca/en/registration" target="_blank">membership</a> to (both WSFS and the additional level required for physical attendance) before the date of the convention. If this is financially impossible, we will have some <a href="/scholarships" target="_blank">scholarships</a> which may be available to you.</p><p>Like all members, Participants must agree to and follow our <a href="/code-conduct-and-policies" target="_blank">Code of Conduct</a>.&nbsp;</p>'
    '#format': full_html
  first_name:
    '#type': textfield
    '#title': 'First Name'
    '#required': true
    '#required_error': 'Your first name is required'
  last_name:
    '#type': textfield
    '#title': 'Last Name'
    '#required': true
    '#required_error': 'Your last name is required'
  email_address:
    '#type': email
    '#title': 'Email Address'
    '#required': true
  kind_programming:
    '#type': textarea
    '#title': 'What kind(s) of programming would you like to be part of - panels, workshops, solo presentations, presentation of academic papers or something else?'
  interests:
    '#type': textarea
    '#title': 'What are your interests?'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Next »'
    '#reset__label': 'Clear Form'
