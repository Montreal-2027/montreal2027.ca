title: "Formulaire de candidature pour le programme de bourses pour l'Équipe de la Convention mondiale Montréal2027"
elements: |
  form_intro:
    '#text': "<h2>Formulaire de candidature pour le programme de bourses pour l'Équipe de la Convention mondiale Montréal2027</h2><p>Si vous souhaitez postuler pour une bourse réservée aux membres de l'équipe, veuillez remplir ce formulaire.</p>"
  what_is_your_first_name_and_last_name:
    '#title': 'Prénom et nom de famille? '
    '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Il doit s’agir de votre nom légal, le même que vous utilisez pour vos opérations bancaires.(Nécessaire pour l’attribution de TOUTE bourse ou prix; le nom qui figurera sur votre badge peut toutefois être différent.)</span></p>'
  if_you_are_usually_known_by_another_name_in_fandom_please_add_it:
    '#title': 'Si vous êtes généralement connu(e) sous un autre nom dans le fandom, veuillez l’indiquer ici: '
    '#description': '<p>Veuillez noter que les aides financières, y compris pour l’adhésion « participant » à la Worldcon de Montréal 2027 (qui vous permet de participer à la Convention en présentiel et en ligne, si vous avez déjà votre adhésion à la WSFS) DOIVENT être attribuées à votre nom légal, celui que vous utilisez pour les opérations bancaires.</p>'
  please_enter_your_email_address:
    '#title': 'Adresse de courrier électronique (adresse de courriel):'
    '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Nous communiquerons avec vous par courriel. Veuillez vous assurer qu</span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">’</span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">il s</span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">’</span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">agit d</span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">’</span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">une adresse que vous consultez régulièrement.</span></p>'
  please_state_where_you_will_likely_live_at_the_time_of_the_montr:
    '#title': 'Veuillez indiquer où vous comptez demeurer pendant la Convention mondiale Montréal2027'
    '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Par exemple : Ville/Département, Ville/Région, Ville/Pays, etc.</span></p>'
  why_would_you_like_to_volunteer_at_a_higher_level_for_montreal_2:
    '#title': "Pourquoi aimeriez-vous occuper un poste à responsabilité au sein de l'équipe de bénévoles de la Worldcon Montréal 2027 ?"
    '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Exemples : « Je participe à la candidature d’une prochaine Convention mondiale », « Je sou-haite apprendre de l’intérieur le fonctionnement d’une Convention afin d’acquérir de l’expérience », etc. Notre intention ici est de vous connaître un peu mieux.</span></p>'
  are_you_currently_working_on_a_convention_now_if_yes_explain_in:
    '#title': 'Travaillez-vous actuellement pour une autre convention ? (Si oui, précisez à quel titre.)'
  what_other_experiences_of_convention_running_do_you_have_include:
    '#title': 'Quelles autres expériences avez-vous dans l’organisation de conventions?  (Ex.: Congrès, colloques, conférences, festivals, salons du livre, ou autres événements semblables que vous jugez pertinents)'
  what_areas_are_you_interested_in_you_may_select_more_than_1:
    '#title': 'Quels sont les domaines qui vous intéressent ? Vous pouvez en sélectionner plusieurs.'
    '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Si vous n’êtes pas certain(e) que vos intérêts correspondent aux choix ci-dessous, sélectionnez « Autre&nbsp;</span></p>'
    '#options':
      "Chair's Team": 'Équipe de direction'
      'Convention Services': 'Services de la convention'
      Events: Événements
      Exhibits: Expositions
      'Member Services': 'Services aux membres'
      'Online Operations (You will do this role AT THE CONVENTION, not remotely).': 'Activités en ligne (ce rôle s’effectue SUR PLACE pendant la convention, et non à distance)'
      Programme: Programmation
      'Technology and Production': 'Technologie et production'
      WSFS: 'Services de la WSFS'
  if_you_chose_more_than_one_option_or_other_in_the_previous_quest:
    '#title': 'Si vous avez choisi plusieurs options ou « Autre » à la question précédente, veuillez développer votre réponse ici. Si vous avez choisi plusieurs options, indiquez ici celle que vous trouvez la plus intéressante.'
  how_much_time_are_you_willing_to_spend_working_for_montreal_2027:
    '#title': 'Combien de temps êtes-vous prêt(e) à consacrer à la Convention mondiale Montréal2027 ?'
    '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">La Convention mondiale Montréal 2027 s’attend à ce que vous soyez bénévole avant la convention en vous impliquant dans les étapes de planification et de préparation, que vous arriviez au moins un jour avant la Convention, que vous vous portiez volontaire pendant la Convention, et que vous soyez prêt(e) à assumer les responsabilités de niveau&nbsp; cadre au sein de l''équipe. Prévoyez un niveau d’engagement important : ce n’est pas une simple vacation qui serait bouclée définitivement en trois heures de temps.</span></p>'
  please_outline_any_accessibility_support_needs_or_restrictions_t:
    '#title': 'Veuillez indiquer vos besoins en termes d’accessibilité, ou toute autre restriction à prendre en compte lors de votre affectation.'
  intro:
    '#text': '<h3>Combien ? Et pour quoi faire ?</h3><p>Comme le programme dépend d’un financement participatif, nous ne savons pas combien d’argent sera collecté. Nous ignorons aussi combien de personnes postuleront. Notre objectif est d’aider celles et ceux qui souhaitent approfondir leurs compétences de bénévole, et non de baser l’attribution uniquement sur le besoin financier.</p><p>Vous pourriez ne pas recevoir le total du montant demandé. Le montant maximum de la bourse est de 1 500 $ CAD.</p>'
  what_is_the_amount_of_scholarship_award_you_are_seeking_please_p:
    '#title': 'Quel montant de bourse souhaitez-vous recevoir ?  Veuillez indiquer un montant minimum et maximum. Le Supplément de Membre présent à la Convention (Attending Member Supplement) est fourni ; ne l’incluez pas dans votre demande.'
    '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Vous devez en revanche acheter séparément votre propre adhésion WSFS dans le cadre de toute bourse attribuée par la Convention mondiale Montréal2027.</span></p>'
  please_indicate_your_expenses_provide_estimated_amounts_for_item:
    '#title': 'Veuillez indiquer vos dépenses. Fournissez des montants estimatifs pour chaque poste en dollars canadiens (CAD).'
    '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Par exemple : billets d’avion pour Montréal à 600 CAD, 3 nuits d’hôtel à 150 CAD pour un total de 450 CAD, 5 trajets Uber/Lyft à 50 CAD pour un total de 250 CAD, etc.</span></p>'
  is_there_anything_else_you_would_like_us_to_know_when_considerin:
    '#title': 'Souhaitez-vous que nous prenions des facteurs additionnels en compte pour l’évaluation de votre candidature ?  Les informations supplémentaires nous aident à prendre des décisions en meilleure connaissance de cause.'
settings:
  confirmation_title: Merci
  confirmation_message: '<p>Votre candidature au programme de bourses pour le personnel a été soumise. Un membre de notre équipe prendra contact avec vous.</p>'
