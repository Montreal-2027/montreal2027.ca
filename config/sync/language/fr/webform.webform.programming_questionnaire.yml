title: 'Questionnaire de participation à la programmation'
elements: |
  intro:
    '#admin_title': 'Introduction du formulaire'
    '#text': "<h1 class=\"text-align-center\">Questionnaire préliminaire de participation à la programmation</h1><p>Veuillez noter qu'il s'agit ici d'un formulaire préliminaire; un questionnaire plus détaillé vous sera envoyé plus tard. Nous nous attendons à ce qu'il y ait beaucoup plus de gens intéressés à participer que de places disponibles. Nous ne pouvons donc pas garantir votre participation au programme. Quoi qu'il arrive, nous vous remercions chaleureusement de vous proposer.</p><p>Notez par ailleurs que pour participer au programme de la Worldcon Montréal 2027, il vous faudra adhérer à la WSFS (de même qu'à un niveau d'<a href=\"https://montreal2027.ca/fr/registration\">adhésion</a> vous permettant d'assister en personne à l'événement). Si cela vous présente des difficultés financières, n'hésitez pas à faire appel à notre <a href=\"https://montreal2027.ca/fr/scholarships\">programme de bourse</a>.</p><p>Comme tous les membres, les participants doivent avoir lu et accepté notre <a href=\"https://montreal2027.ca/fr/code-de-conduite\">Code de conduite</a>.</p>"
  first_name:
    '#title': Prénom
    '#required_error': 'Le champ Prénom est obligatoire'
  last_name:
    '#title': 'Nom de famille'
    '#required_error': 'Le champ Nom de famille est obligatoire'
  email_address:
    '#title': Courriel
  kind_programming:
    '#title': 'À quel(s) titre(s) de programmation souhaitez vous participer? Ex.: Panel, atelier, présentation solo...'
  interests:
    '#title': "Quels sont vos champs d'intérêt?"
  actions:
    '#title': 'Bouton(s) de confirmation'
    '#submit__label': 'Suivant »'
    '#reset__label': 'Réinitialiser le formulaire'
