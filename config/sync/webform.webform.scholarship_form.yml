id: scholarship_form
title: 'Montréal 2027 Worldcon Team Scholarship Programme Application'
description: ''
categories: {  }
elements: |-
  section_1_of_2:
    '#type': webform_wizard_page
    '#title': 'Section 1 of 2'
    form_intro:
      '#type': processed_text
      '#admin_title': 'Staff Scholarship Programme Application'
      '#display_on': both
      '#text': '<h2>Montréal 2027 Worldcon Team Scholarship Programme Application</h2><p>If you are interested in applying for a Team Scholarship award fill this form out.&nbsp;&nbsp;</p>'
      '#format': basic_html
    what_is_your_first_name_and_last_name:
      '#type': textfield
      '#title': 'What is your first name and last name?'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">This must be the legal name that you use for financial transactions.&nbsp; (This does NOT have to be the name on your badge; this is needed to deliver ANY award.)</span></p>'
      '#description_display': before
      '#required': true
    if_you_are_usually_known_by_another_name_in_fandom_please_add_it:
      '#type': textfield
      '#title': 'If you are usually known by another name in fandom, please add it here.'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">If you wish to use a nickname or a handle this is where you put that.&nbsp; Be aware that financial awards, including Attending Member Supplements, MUST be awarded in your legal name, the one you use for financial transactions.</span></p>'
      '#description_display': before
    please_enter_your_email_address:
      '#type': email
      '#title': 'Please enter your email address'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">We will communicate with you via email.&nbsp; Please make sure this is one you check regularly.</span></p>'
      '#description_display': before
      '#required': true
    please_state_where_you_will_likely_live_at_the_time_of_the_montr:
      '#type': textfield
      '#title': 'Please state where you will likely live at the time of the Montréal 2027 Worldcon.'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">e.g. City/State, City/Province, City/Country, prefacture/Country and similar</span></p>'
      '#description_display': before
    why_would_you_like_to_volunteer_at_a_higher_level_for_montreal_2:
      '#type': textarea
      '#title': 'Why would you like to volunteer at a higher level for Montréal 2027 Worldcon? '
      '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">e.g. Participating in a future Worldcon as part of a bid,&nbsp;learning how a different convention works to gain experience and similar is part of the answer.&nbsp; We''re looking for details to get to know you a little better.</span></p>'
      '#description_display': before
    are_you_currently_working_on_a_convention_now_if_yes_explain_in:
      '#type': textarea
      '#title': 'Are you currently working on a convention now? (if yes, explain in what capacity)'
      '#description_display': before
    what_other_experiences_of_convention_running_do_you_have_include:
      '#type': textarea
      '#title': 'What other experiences of convention running do you have? (include conferences, book festivals and other similar events if applicable).'
      '#description_display': before
    what_areas_are_you_interested_in_you_may_select_more_than_1:
      '#type': webform_checkboxes_other
      '#title': 'What areas are you interested in? You may select more than one.'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">If you are unsure of where your interests fit into the choices below select "Other".</span></p>'
      '#description_display': before
      '#options':
        "Chair's Team": "Chair's Team"
        Communications: Communications
        'Convention Services': 'Convention Services'
        Events: Events
        Exhibits: Exhibits
        Facilities: Facilities
        'Member Services': 'Member Services'
        'Online Operations (You will do this role AT THE CONVENTION, not remotely).': 'Online Operations'
        Programme: Programme
        'Technology and Production': 'Technology and Production'
        WSFS: WSFS
      '#other__option_label': 'Other:'
      '#other__placeholder': ''
    if_you_chose_more_than_one_option_or_other_in_the_previous_quest:
      '#type': textarea
      '#title': 'If you chose more than one option or "Other" in the previous question please expand your answer here.  If you chose several options in the previous question please state the one you find most most interesting here.'
      '#description_display': before
    how_much_time_are_you_willing_to_spend_working_for_montreal_2027:
      '#type': textarea
      '#title': 'How much time are you willing to spend working for Montréal 2027 Worldcon?'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Montréal 2027 Worldcon expectations are that you will volunteer before the convention in planning and preparation work, that you will arrive a minimum of 1 day prior to the convention as well as volunteer at the convention, and that you will be expected to fulfill the duties of a senior staff member. This is NOT a 3 hour shift and then done position.</span></p>'
      '#description_display': before
      '#required': true
    please_outline_any_accessibility_support_needs_or_restrictions_t:
      '#type': textarea
      '#title': 'Please outline any accessibility support needs or restrictions that need to be considered when assigning you?'
      '#description_display': before
  section_2_of_2:
    '#type': webform_wizard_page
    '#title': 'Section 2 of 2'
    intro:
      '#type': processed_text
      '#admin_title': 'How Much?  And For What? '
      '#text': '<h3>How Much? &nbsp;And For What?&nbsp;</h3><p>As this is a crowd-funded program we do not know how much money will be raised, nor do we know how many people will apply. Our intent is to assist those who are interested in deepening their volunteer skills rather than being based solely on financial need. You may not be awarded the full amount you request. Maximum award amount is $1500 CAD.</p>'
      '#format': basic_html
    what_is_the_amount_of_scholarship_award_you_are_seeking_please_p:
      '#type': textfield
      '#title': 'What is the amount of scholarship award you are seeking?  Please provide a minimum to maximum level.  The Attending Member Supplement is provided; do not include that amount in your request.'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">You must purchase your own WSFS membership as part of any award received from Montréal 2027 Worldcon.&nbsp;&nbsp;</span></p>'
      '#required': true
    please_indicate_your_expenses_provide_estimated_amounts_for_item:
      '#type': textarea
      '#title': 'Please indicate your expenses. Provide estimated amounts for items in Canadian Dollars (CAD)'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:docs-Roboto;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">e.g. Plane tickets to Montréal @ $600CAD,, 3 hotel nights at $150 for $450CAD, 5 Uber/Lyft fare at $50 for $250 and similar</span></p>'
      '#required': true
    is_there_anything_else_you_would_like_us_to_know_when_considerin:
      '#type': textarea
      '#title': 'Is there anything else you would like us to know when considering your application? More information helps us make better informed decisions. '
