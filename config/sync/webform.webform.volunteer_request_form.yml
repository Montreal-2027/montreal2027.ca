id: volunteer_request_form
title: 'Volunteer Request Form'
description: '<p>A form to request volunteer services search the volunteer signups to fill a role</p>'
categories: {  }
elements: |-
  intro:
    '#type': processed_text
    '#text': '<h2 class="text-align-center">Volunteer Request Form</h2><p>Do you have a role to fill in your division or area and don''t know how to find someone? Answer a few quick questions, and Volunteer Services will comb through all the volunteer sign-ups looking for a good fit, and then email you the names of anyone they found.</p><p>If they couldn''t find anyone, they will put together a help wanted ad that will be posted on the website to invite people to apply for that specific position.</p>'
    '#format': basic_html
  horizontal_rule:
    '#type': webform_horizontal_rule
  section_1:
    '#type': webform_wizard_page
    '#title': 'Section 1 : All About You'
    name:
      '#type': textfield
      '#title': 'Your Name'
      '#disabled': true
      '#readonly': true
      '#default_value': '[current-user:field_first_name] [current-user:field_last_name]'
    email_address:
      '#type': textfield
      '#title': 'Email Address'
      '#disabled': true
      '#readonly': true
      '#default_value': '[current-user:mail]'
    team_title:
      '#type': textfield
      '#title': 'Your Team Title'
      '#maxlength': 75
      '#required': true
      '#required_error': 'Your team title is required'
      '#counter_type': character
      '#counter_maximum': 73
      '#default_value': '[current-user:field_title]'
    send_to:
      '#type': email
      '#title': 'Send emails to'
      '#maxlength': 75
      '#required': true
      '#default_value': '[current-user:mail]'
    ad_visibility:
      '#type': radios
      '#title': 'Ad visibility'
      '#options':
        public: 'Public -- The ad will visible to anyone who visits the website'
        team: 'Team Only -- The ad will only be visible to team members when they are logged in'
      '#required': true
      '#required_error': 'You must choose a visibility'
  section_2_about_the_role_you_need_to_fill:
    '#type': webform_wizard_page
    '#title': 'Section 2 : About the role you need to fill'
    processed_text:
      '#type': processed_text
      '#text': '<p>These questions will help describe the volunteer role that you are looking to fill</p>'
      '#format': basic_html
    horizontal_rule_01:
      '#type': webform_horizontal_rule
    title_role_needed:
      '#type': textfield
      '#title': 'Title of the role'
      '#maxlength': 75
      '#counter_type': character
      '#counter_maximum': 75
      '#required': true
    role_type:
      '#type': select
      '#title': 'Role Type'
      '#options':
        DDH: 'Deputy Division Head'
        AH: 'Area Head'
        DAH: 'Deputy Area Head'
        Team: 'Team Member'
      '#empty_option': 'Select a role type'
      '#required': true
      '#required_error': 'You must select a role type'
    skills_needed:
      '#type': webform_checkboxes_other
      '#title': 'What general skills do they need in order to perform the role? Check all that apply.'
      '#options':
        basic_computer: 'Basic computer skills -- Use email, Google Docs/Sheets, social media, and other similar'
        public_facing: 'Public facing -- Comfortable in a public facing role'
        child_facing: 'Child facing -- Comfortable in a child facing role'
        team_facing: 'Volunteer Team facing -- Comfortable in a volunteer team member facing role'
        discretion: 'Discretion -- Must be able to handle sensitive information and respect privacy'
        public_speaking: 'Public Speaking -- Comfortable with public speaking (announcements, moderating, and similar)'
        de_escelation: 'De-escelation -- Conflict resolution, intervention, calming techniques, and similar'
        food: 'Comfortable around food -- Basic food safety skills'
        detail: 'Detail oriented -- Good with taking notes, etc'
      '#other__option_label': 'Other skills needed'
      '#other__placeholder': 'Enter other skills needed'
      '#other__maxlength': '75'
      '#other__counter_type': character
      '#other__counter_maximum': '75'
      '#required': true
    other_skills:
      '#type': textarea
      '#title': 'Other skills'
      '#description': '<p>If you answered other in the previous question and need more space, add your additional information here.</p>'
      '#maxlength': 300
      '#counter_type': character
      '#counter_maximum': 300
