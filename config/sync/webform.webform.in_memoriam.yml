id: in_memoriam
title: 'In Memoriam'
description: '<p>In Memoriam submission form</p>'
categories: {  }
elements: |-
  intro:
    '#type': processed_text
    '#text': '<h2 class="text-align-center">In Memoriam</h2><p>Thank you for your interest in adding someone to the In Memoriam listings on the Montréal 2027 website. This will help us tremendously.&nbsp; Please provide all of the information below, along with a valid email address for you (the submitter), so we can reach out if we have further questions.</p>'
    '#format': full_html
  horizontal_rule:
    '#type': webform_horizontal_rule
  name_of_submitter:
    '#type': textfield
    '#title': 'Your Name'
    '#required': true
    '#required_error': 'Your name is required.'
  submitter_email:
    '#type': email
    '#title': 'Your email address'
    '#required': true
    '#required_error': 'Your email address is required.'
  deceased_container:
    '#type': container
    '#attributes':
      class:
        - webform-2col
    deceased_first_name:
      '#type': textfield
      '#title': 'First name of the deceased'
      '#maxlength': 26
    deceased_last_name:
      '#type': textfield
      '#title': 'Last Name of the deceased'
      '#maxlength': 30
      '#required': true
      '#required_error': 'We need the last name of the deceased'
  category:
    '#type': webform_term_select
    '#title': Category
    '#multiple': true
    '#choices': true
    '#required': true
    '#required_error': 'You must select at least one category'
    '#vocabulary': in_memoriam
    '#depth': 1
  dates:
    '#type': container
    '#attributes':
      class:
        - webform-2col
    birth_year:
      '#type': textfield
      '#title': "Year of the deceased's birth (if known)"
      '#minlength': 4
      '#maxlength': 1
      '#size': 8
    date_of_death:
      '#type': container
      '#attributes':
        class:
          - webform-2row
      date_of_death_label:
        '#type': webform_markup
        '#markup': '<div><label>Date of Death, if known</label></div>'
      date_container:
        '#type': container
        '#attributes':
          class:
            - webform-3col
        month_of_death:
          '#type': select
          '#title': Month
          '#title_display': invisible
          '#options': months
          '#empty_option': Month
        day_of_death:
          '#type': number
          '#title': Day
          '#title_display': invisible
          '#required': true
          '#default_value': '1'
          '#wrapper_attributes':
            class:
              - 'form--inline clearfix'
          '#attributes':
            class:
              - day-of-death
          '#min': 1
          '#max': 31
          '#step': 1
        year_of_death:
          '#type': select
          '#title': ' '
          '#title_display': inline
          '#options':
            2026: '2026'
            2027: '2027'
          '#empty_option': Year
          '#required_error': 'Year is required'
          '#states':
            required:
              ':input[name="month_of_death"]':
                filled: true
          '#wrapper_attributes':
            class:
              - year-of-death-wrapper
  reason:
    '#type': textarea
    '#title': 'Why should this person be included on our list?'
    '#required': true
    '#required_error': 'You must provide a reason why the person should be included.'
  horizontal_rule_01:
    '#type': webform_horizontal_rule
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Submit
