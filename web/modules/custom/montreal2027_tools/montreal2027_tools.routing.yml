montreal2027_tools.staff:
  path: '/team'
  defaults:
    _controller: '\Drupal\montreal2027_tools\Controller\StaffPageController::build'
    _title: 'Team'
  requirements:
    _permission: 'access content'

montreal2027_tools.staff_contact_submit:
  path: '/team/contact-submit'
  defaults:
    _controller: '\Drupal\montreal2027_tools\Controller\StaffContactController::submit'
  methods: [POST]
  requirements:
    _permission: 'access content'

montreal2027_tools.settings:
  path: '/admin/config/montreal2027'
  defaults:
    _form: '\Drupal\montreal2027_tools\Form\MontrealConfigurationForm'
    _title: 'Montreal Configuration'
  requirements:
    _permission: 'administer site configuration'
